[project]
name = "heftig"
version = "0.1.0"
description = "Self-hosted, portable document archive with local search and optional AI text extraction and classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Johannes Pfeffer" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Framework :: FastAPI",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "httpx>=0.27",
  "snowballstemmer>=3.0",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
# `heftig mcp`: connect Claude (Desktop / Code) to the archive, see docs/mcp.md
mcp = ["mcp>=2.2"]

[project.scripts]
heftig = "heftig.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "reportlab>=4.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heftig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["tesseract: needs the tesseract binary with German language data"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S608", "B008", "SIM105", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S", "B"]
"contrib/**" = ["S"]
