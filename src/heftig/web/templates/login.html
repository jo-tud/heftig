{% extends "base.html" %}
{% block title %}{{ _("Sign in") }}{% endblock %}
{% block content %}
<section class="card narrow login">
  <h1><span class="logo" aria-hidden="true">▤</span> Heftig</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ _("Username") }} <input name="username" autocomplete="username" required autofocus></label>
    <label>{{ _("Password") }} <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">{{ _("Sign in") }}</button>
  </form>
</section>
{% endblock %}
